# Builds Lodestar-<tag>.zip with the BigWigs packager and publishes a GitHub
# Release when a v* tag is pushed. Tags with "beta" or "alpha" become pre-releases.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          # Zip named Lodestar-<tag>.zip: the default name adds "-forever" for interface 16xxx
          # (Task 4.4 dry run, notes/beta-probes.md P63). The label after ":" stays the version.
          args: -n "{package-name}-{project-version}:{project-version}"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
